# Every source HDL reads. `license` is what the provider states; `publish` decides whether
# its rows go into the public release bundle. Anything not yet checked stays `publish: false`
# and is built locally only. Change `publish` only after reading the provider's terms.
#
# license_checked: date someone read the provider's terms page, or null.

geography:
  name: OCHA Common Operational Datasets, administrative boundaries (COD-AB)
  provider: OCHA via HDX
  url: https://data.humdata.org/dataset/cod-ab-{iso3_lower}
  license: CC BY-IGO (from the HDX dataset metadata, recorded per country in the receipt)
  attribution: "OCHA, administrative boundaries (COD-AB), via HDX"
  license_checked: null
  publish: true

worldpop:
  name: WorldPop Global2 R2025A, 1 km constrained, total and age/sex structures
  provider: WorldPop, University of Southampton
  url: https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/
  license: CC BY 4.0
  attribution: "WorldPop (www.worldpop.org), Global2 R2025A"
  license_checked: null
  publish: true

grid3_nga:
  name: GRID3 / WorldPop Nigeria population v3.0 (2025), LGA totals
  provider: WorldPop and GRID3 Nigeria
  url: https://data.worldpop.org/repo/wopr/NGA/population/v3.0/
  doi: 10.5258/SOTON/WP00782
  license: CC BY 4.0
  attribution: "WorldPop and GRID3 (2025). Nigeria population v3.0. doi:10.5258/SOTON/WP00782"
  license_checked: null
  publish: true

hapi:
  name: HDX Humanitarian API country packages (needs, IPC, operational presence, IDPs, refugees, returnees, funding, conflict, national risk, baseline population)
  provider: OCHA Centre for Humanitarian Data (HDX HAPI), from many upstream providers
  url: https://data.humdata.org/dataset/hdx-hapi-{iso3_lower}
  license: per upstream dataset (recorded in the receipt); conflict events are ACLED-derived and carry ACLED's terms
  attribution: "HDX HAPI, OCHA Centre for Humanitarian Data, and the upstream providers named in each row"
  license_checked: null
  publish: false

wuenic:
  name: WHO/UNICEF Estimates of National Immunization Coverage (WUENIC)
  provider: UNICEF data warehouse (SDMX)
  url: https://sdmx.data.unicef.org/
  license: see UNICEF data terms
  attribution: "WHO/UNICEF Estimates of National Immunization Coverage, via UNICEF"
  license_checked: null
  publish: false

dhs:
  name: The DHS Program indicator API (national and subnational survey estimates)
  provider: ICF, The DHS Program (USAID-funded)
  url: https://api.dhsprogram.com/
  license: see DHS Program terms of use
  attribution: "The DHS Program, ICF, via the DHS Program API"
  license_checked: null
  publish: false

unpd_fp:
  name: UN DESA Population Division, Estimates and Projections of Family Planning Indicators 2024
  provider: UN DESA Population Division (public CSV zip; the data-portal API needs a token, the file does not)
  url: https://population.un.org/wpp/Data_FamilyPlanningIndicators_2024.zip
  license: see UN DESA terms of use (to check)
  attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). Estimates and Projections of Family Planning Indicators 2024"
  license_checked: null
  publish: false

unpd_wpp:
  name: UN World Population Prospects 2024 (births, mortality, married women, urbanization, single-year ages), national
  provider: UN DESA Population Division data portal API (token UNPD_API_TOKEN)
  url: https://population.un.org/dataportal/
  license: believed CC BY 3.0 IGO (World Population Prospects); to confirm before publishing
  attribution: "United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024"
  license_checked: null
  publish: false

unicef_nutrition:
  name: UNICEF/WHO/World Bank Joint Child Malnutrition Estimates and national survey estimates
  provider: UNICEF data warehouse (SDMX, NUTRITION dataflow)
  url: https://sdmx.data.unicef.org/
  license: see UNICEF data terms (to check)
  attribution: "UNICEF/WHO/World Bank Joint Child Malnutrition Estimates, via UNICEF"
  license_checked: null
  publish: false

uis:
  name: UNESCO Institute for Statistics, out-of-school children and rates
  provider: UNESCO UIS public data API
  url: https://api.uis.unesco.org/api/public/data/indicators
  license: see UIS terms of use (to check)
  attribution: "UNESCO Institute for Statistics (UIS)"
  license_checked: null
  publish: false

shds_som:
  name: Somali Health and Demographic Survey 2020, national and by residence (entered by hand)
  provider: Federal Government of Somalia (Directorate of National Statistics) with UNFPA
  url: https://somalia.unfpa.org/en/publications/somali-health-and-demographic-survey-2020
  license: published report (terms to check)
  attribution: "Federal Government of Somalia and UNFPA (2020). The Somali Health and Demographic Survey 2020"
  license_checked: null
  publish: false

rwi:
  name: Relative Wealth Index (Meta Data for Good)
  provider: Meta and Center for Effective Global Action, via HDX
  url: https://data.humdata.org/dataset/relative-wealth-index
  license: CC BY-NC 4.0 (non-commercial)
  attribution: "Chi et al. (2022), Microestimates of wealth for all low- and middle-income countries, PNAS; Meta Data for Good"
  license_checked: null
  publish: false

iati:
  name: IATI Datastore, active aid activities by country and sector, and IRC's published activities
  provider: International Aid Transparency Initiative (IATI) Datastore API (key IATI_API_KEY)
  url: https://api.iatistandard.org/datastore
  license: each publisher's IATI license (mostly open); to check
  attribution: "IATI Datastore, and the publishers named in each activity"
  license_checked: null
  publish: false

opencellid:
  name: OpenCelliD cell tower database, counted per admin area
  provider: OpenCelliD (Unwired Labs), crowdsourced (token OPENCELLID_TOKEN)
  url: https://opencellid.org/
  license: CC BY-SA 4.0 (share-alike)
  attribution: "OpenCelliD Project, licensed under CC BY-SA 4.0"
  license_checked: null
  publish: false

ihme:
  name: IHME subnational vaccine coverage 2025 (DTP1, DTP3, MCV1), 5 km surfaces
  provider: Institute for Health Metrics and Evaluation (IHME)
  url: none public; one-time download from IHME, repackaged on 2026-08-27 and kept in a private folder
  license: IHME terms (not yet checked)
  attribution: "Institute for Health Metrics and Evaluation (IHME), vaccine coverage estimates 2025"
  license_checked: null
  publish: false
  snapshot: true
  as_of: "2026-08-27"   # every row carries this; refresh only by a new manual download

derived:
  name: HDL cross-source estimates (e.g. national zero-dose children = WorldPop under-1 x (1 - WUENIC DTP1))
  provider: this repository
  url: src/hdl/sources/derived.py
  license: inherits its inputs' terms
  attribution: "Humanitarian Data Layer, from the sources named in each row's method"
  license_checked: null
  publish: false

# Wired in later, once keys arrive or terms are checked:
#   ipc_amn (IPC API key requested 2026-11-10).
#
# Snapshot sources (snapshot: true) come from a one-time download or a shared folder, not a URL HDL can
# refetch. Their rows carry `as_of` and a build without the files on disk skips them and says so.
