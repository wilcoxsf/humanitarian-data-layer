# Data dictionary: one entry per source_id/metric. `caveat` is what a reader (or a Claude skill)
# must not get wrong. Plugins add their own entries the same way.

worldpop/population_total: {definition: "Total population, WorldPop Global2 R2025A 1 km constrained, summed over the area", caveat: "2026-2030 are WorldPop projections (status projection). Use this as the default denominator; COD-PS and GRID3 are alternative estimates, never mixed in."}
worldpop/population_under1: {definition: "Population aged 0 (WorldPop age band 00)", caveat: "Approximates the surviving-infant cohort used for immunization targets."}
worldpop/population_under5: {definition: "Population aged 0-4 (bands 00 + 01)", caveat: "Denominator for nutrition (6-59 months is about 90% of it)."}
worldpop/women_15_49: {definition: "Female population aged 15-49 (bands f_15 to f_45)", caveat: "Denominator for family planning (women of reproductive age, all marital statuses)."}
grid3_nga/population_total_grid3: {definition: "GRID3/WorldPop Nigeria v3.0 2025 population, published state and LGA totals", caveat: "A second Nigeria estimate on GRID3 boundaries, matched to OCHA areas by name; 38 LGAs unmatched. Do not add to WorldPop."}
hapi/population_total_cod_ps: {definition: "OCHA COD-PS population (government/UNFPA based)", caveat: "Not WorldPop. Often older baselines (Somalia 2014). Do not mix with WorldPop in one calculation."}
hapi/population_under5_cod_ps: {definition: "OCHA COD-PS population aged 0-4", caveat: "As population_total_cod_ps."}
hapi/people_in_need: {definition: "People in need from the OCHA Humanitarian Needs Overview, by sector (breakdown sector=...)", caveat: "Sectors overlap: never add sectors together; use sector=Intersectoral for the overall figure. Admin1 rows may be derived sums of admin2 (status derived, or partial when districts do not reach the national headline). Some countries carry a second national figure with category=total."}
hapi/people_targeted: {definition: "People targeted by the humanitarian response plan, by sector", caveat: "A plan figure, not need. Same overlap rules as people_in_need."}
hapi/people_reached: {definition: "People reached as reported in the HNO/HRP", caveat: "Sparse; national only."}
hapi/people_affected: {definition: "People affected as reported in the HNO", caveat: "Sparse."}
hapi/population_in_ipc_phase: {definition: "People in each IPC/CH acute food insecurity phase (breakdown ipc_type and phase; phase=all is the analysed population)", caveat: "Acute FOOD INSECURITY, not acute malnutrition. Projections carry status projection. Somalia and others analyse livelihood zones and urban/IDP groups: those units stay unmatched (pcode IPC:...), never forced onto districts."}
hapi/share_in_ipc_phase: {definition: "Share of the analysed population in the phase", caveat: "Recomputed from summed units where several units sit in one area."}
hapi/organizations_reported: {definition: "Distinct organizations listed in the OCHA 3W/5W for the area and sector, latest period", caveat: "Who reports to the cluster, not full coverage. A missing organization may still operate there."}
hapi/idps: {definition: "Internally displaced people, IOM DTM via HAPI, latest round of each operation/assessment series", caveat: "Series are not summed. Rounds older than two years are stale."}
hapi/persons_of_concern: {definition: "UNHCR refugees and other persons of concern in the country (breakdown group, origin)", caveat: "National only. Group REF = refugees, ASY = asylum seekers, OOC = others of concern."}
hapi/returnees: {definition: "UNHCR returnees", caveat: "National only."}
hapi/appeal_requirements: {definition: "Humanitarian appeal requirements, OCHA FTS", caveat: "USD, by appeal."}
hapi/appeal_funding: {definition: "Funding received against the appeal, OCHA FTS", caveat: "USD, by appeal; 'Not specified' rows are funding outside an appeal."}
hapi/appeal_funded_share: {definition: "Share of the appeal funded", caveat: "Percent."}
hapi/conflict_events: {definition: "Conflict events in the last 12 months (ACLED monthly aggregates via HAPI), by event type", caveat: "ACLED terms apply. Months without data count as zero within the window."}
hapi/conflict_fatalities: {definition: "Reported conflict fatalities in the last 12 months (ACLED via HAPI)", caveat: "As conflict_events."}
hapi/inform_overall_risk: {definition: "INFORM Risk index, 0-10", caveat: "National."}
hapi/inform_hazard_exposure_risk: {definition: "INFORM hazard and exposure dimension, 0-10", caveat: "National."}
hapi/inform_vulnerability_risk: {definition: "INFORM vulnerability dimension, 0-10", caveat: "National."}
hapi/inform_coping_capacity_risk: {definition: "INFORM lack of coping capacity dimension, 0-10", caveat: "National."}
hapi/inform_global_rank: {definition: "INFORM global rank", caveat: "1 = highest risk."}
wuenic/dtp1_coverage: {definition: "WHO/UNICEF estimate of national DTP1 coverage among surviving infants", caveat: "National only; never applied to districts."}
wuenic/dtp3_coverage: {definition: "WHO/UNICEF estimate of national DTP3 coverage", caveat: "National only."}
wuenic/mcv1_coverage: {definition: "WHO/UNICEF estimate of national MCV1 coverage", caveat: "National only."}
wuenic/mcv2_coverage: {definition: "WHO/UNICEF estimate of national MCV2 coverage", caveat: "National only."}
ihme/dtp1_coverage_ihme: {definition: "IHME 2025 DTP1 coverage, WorldPop under-1 weighted mean over the area (breakdown bound=lower/upper for uncertainty)", caveat: "Restricted (IHME terms). Snapshot as_of 2026-08-27. Not available for Haiti. Interval level undocumented."}
ihme/dtp3_coverage_ihme: {definition: "IHME 2025 DTP3 coverage, under-1 weighted", caveat: "As dtp1_coverage_ihme."}
ihme/mcv1_coverage_ihme: {definition: "IHME 2025 MCV1 coverage, under-1 weighted", caveat: "As dtp1_coverage_ihme."}
dhs/mcpr_married_women: {definition: "Married women using a modern contraceptive method, DHS", caveat: "Survey year in period; Haiti 2016 and Yemen 2013 are stale. Admin1 only."}
dhs/mcpr_all_women: {definition: "All women using a modern method, DHS", caveat: "As mcpr_married_women."}
dhs/unmet_need_married_women: {definition: "Married women with unmet need for family planning, DHS", caveat: "As mcpr_married_women."}
dhs/unmet_need_all_women: {definition: "All women with unmet need for family planning, DHS", caveat: "As mcpr_married_women."}
dhs/dtp1_received_12_23m: {definition: "Children 12-23 months who received DTP1, DHS", caveat: "Survey-based; compare with IHME and WUENIC, do not merge."}
dhs/dtp3_received_12_23m: {definition: "Children 12-23 months who received DTP3, DHS", caveat: "As above."}
dhs/measles_received_12_23m: {definition: "Children 12-23 months who received measles vaccine, DHS", caveat: "As above."}
dhs/no_vaccinations_12_23m: {definition: "Children 12-23 months with no vaccinations (zero-dose proxy), DHS", caveat: "As above."}
dhs/basic_vaccinations_12_23m: {definition: "Children 12-23 months fully vaccinated with basic antigens, DHS", caveat: "As above."}
dhs/wasting_under5: {definition: "Children under 5 wasted (weight-for-height below -2 SD), DHS", caveat: "Point prevalence at survey time; seasonal. Admin1 only."}
dhs/stunting_under5: {definition: "Children under 5 stunted, DHS", caveat: "Admin1 only."}
dhs/underweight_under5: {definition: "Children under 5 underweight, DHS", caveat: "Admin1 only."}
dhs/under5_mortality: {definition: "Under-five mortality rate, DHS", caveat: "Per 1,000 live births; ten-year reference period at admin1."}
dhs/skilled_birth_attendance: {definition: "Births assisted by a skilled provider, DHS", caveat: "Admin1 only."}
dhs/total_fertility_rate: {definition: "Total fertility rate, DHS", caveat: "Births per woman."}
rwi/rwi_mean: {definition: "Mean Meta Relative Wealth Index of ~2.4 km tiles in the area", caveat: "Relative within one country only; never compare across countries. CC BY-NC."}
rwi/rwi_mean_popweighted: {definition: "Relative Wealth Index weighted by WorldPop 2025 population", caveat: "As rwi_mean."}
rwi/rwi_tiles: {definition: "Number of RWI tiles in the area", caveat: "Low counts mean a noisy mean."}
derived/zero_dose_children_estimate: {definition: "Children with no DTP1 = WorldPop under-1 x (1 - WUENIC DTP1)", caveat: "Estimate, national only."}
unpd_fp/mcpr: {definition: "Modern contraceptive prevalence, UN DESA FPET model (breakdown women=all or married_in_union)", caveat: "Model estimate, national; years after 2024 are projections. Not the same as DHS survey values."}
unpd_fp/unmet_need_any_method: {definition: "Unmet need for family planning, any method, UN DESA FPET", caveat: "Model estimate, national."}
unpd_fp/unmet_need_modern: {definition: "Unmet need for modern methods, UN DESA FPET", caveat: "Model estimate, national."}
unpd_fp/demand_satisfied_modern: {definition: "Demand for family planning satisfied by modern methods (SDG 3.7.1), UN DESA FPET", caveat: "Model estimate, national."}
unpd_fp/modern_method_users: {definition: "Women using a modern method, UN DESA FPET", caveat: "Thousands of women, national."}
unpd_fp/unmet_need_modern_women: {definition: "Women with unmet need for modern methods, UN DESA FPET", caveat: "Thousands of women, national."}
unicef_nutrition/stunting_under5_jme_model: {definition: "Stunting among children under 5, JME country-level modelled estimate", caveat: "Annual model series; national only."}
unicef_nutrition/overweight_under5_jme_model: {definition: "Overweight among children under 5, JME modelled estimate", caveat: "National only."}
unicef_nutrition/wasting_under5_survey: {definition: "Wasting among children under 5, latest national survey (source in source_release)", caveat: "Point prevalence at survey time and seasonal; stale when older than 6 years (Somalia's is 2009)."}
unicef_nutrition/severe_wasting_under5_survey: {definition: "Severe wasting among children under 5, latest national survey", caveat: "As wasting_under5_survey."}
unicef_nutrition/stunting_under5_survey: {definition: "Stunting among children under 5, latest national survey", caveat: "Prefer the JME model series for trends."}
uis/out_of_school_rate_primary: {definition: "Out-of-school rate, children of primary school age, UNESCO UIS", caveat: "National; latest year varies by country and can be old (stale beyond 6 years)."}
uis/out_of_school_rate_lower_secondary: {definition: "Out-of-school rate, adolescents of lower secondary age, UIS", caveat: "As above."}
uis/out_of_school_rate_upper_secondary: {definition: "Out-of-school rate, youth of upper secondary age, UIS", caveat: "As above."}
uis/out_of_school_children_primary: {definition: "Number of out-of-school children of primary school age, UIS", caveat: "As above."}
uis/out_of_school_adolescents_lower_secondary: {definition: "Number of out-of-school adolescents of lower secondary age, UIS", caveat: "As above."}
uis/out_of_school_youth_upper_secondary: {definition: "Number of out-of-school youth of upper secondary age, UIS", caveat: "As above."}
dhs/net_attendance_primary: {definition: "Net primary school attendance rate, DHS", caveat: "Admin1; survey year in period."}
dhs/net_attendance_primary_girls: {definition: "Net primary school attendance rate, girls, DHS", caveat: "Admin1."}
dhs/net_attendance_secondary: {definition: "Net secondary school attendance rate, DHS", caveat: "Admin1."}
dhs/net_attendance_secondary_girls: {definition: "Net secondary school attendance rate, girls, DHS", caveat: "Admin1."}
hapi/food_price_retail_median: {definition: "Median retail price across WFP-monitored markets in the area, latest month in the last 12 (breakdown commodity, unit, currency)", caveat: "Local currency unless the currency says otherwise; markets differ by month. For cash transfer sizing context, not a minimum expenditure basket."}
shds_som/mcpr_married_women: {definition: "Married women 15-49 using a modern method, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/any_method_married_women: {definition: "Married women 15-49 using any method, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/unmet_need_married_women: {definition: "Married women with unmet need for spacing or limiting, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/demand_satisfied_modern: {definition: "Share of demand for family planning satisfied by modern methods, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/dtp1_received_12_23m: {definition: "Children 12-23 months who received DTP1, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/dtp3_received_12_23m: {definition: "Children 12-23 months who received DTP3, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/measles_received_12_23m: {definition: "Children 12-23 months who received measles vaccine, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/basic_vaccinations_12_23m: {definition: "Children 12-23 months with all basic vaccinations, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/no_vaccinations_12_23m: {definition: "Children 12-23 months with no vaccinations (zero-dose proxy), SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/stunting_under5: {definition: "Children under 5 stunted, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/severe_stunting_under5: {definition: "Children under 5 severely stunted, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/wasting_under5: {definition: "Children under 5 wasted, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/severe_wasting_under5: {definition: "Children under 5 severely wasted, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/underweight_under5: {definition: "Children under 5 underweight, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/net_attendance_primary: {definition: "Net primary attendance (age 6-13), SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/net_attendance_primary_girls: {definition: "Net primary attendance, girls, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/net_attendance_secondary: {definition: "Net secondary attendance (age 14-18), SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
shds_som/net_attendance_secondary_girls: {definition: "Net secondary attendance, girls, SHDS 2020 (Somalia)", caveat: "National or by residence (urban, rural, nomadic) only: the report has no regional tables. Fieldwork 2018-2019. Entered by hand; table and page are in method."}
iati/iati_active_activities: {definition: "IATI activities in implementation with this recipient country, all publishers (breakdown sector_group=... for DAC sector groups)", caveat: "Counts activities, not money or people. One activity can carry several sectors, so sector counts do not add to the total. Reporting to IATI is voluntary and uneven."}
iati/iati_irc_activities: {definition: "IATI activities where IRC (Inc., UK or Sweden) is the reporting or a participating organization, by status", caveat: "IRC publishes only part of its portfolio to IATI and much of it is old; not a footprint. Titles and dates are in iati_irc_activities.csv."}
opencellid/cell_towers: {definition: "OpenCelliD cells with coordinates inside the area (breakdown radio=GSM, UMTS, LTE, NR, all)", caveat: "Crowdsourced: an area with no recorded cells may still have coverage. CC BY-SA 4.0."}
unpd_wpp/births: {definition: "Live births per year", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/infant_mortality_rate: {definition: "Infant mortality rate per 1,000 live births", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/under5_mortality_rate: {definition: "Under-five mortality rate per 1,000 live births", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/married_women_15_49_share: {definition: "Women 15-49 currently married or in a union, percent", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/married_women_15_49: {definition: "Women 15-49 currently married or in a union, number", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/total_fertility_rate: {definition: "Total fertility rate", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/crude_birth_rate: {definition: "Crude birth rate per 1,000 population", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_by_urbanization: {definition: "Population by degree of urbanization (breakdown cities, towns, rural, cities_and_towns, total)", caveat: "International degree-of-urbanization definition (dense settlements, IDP sites included, count as cities), so far higher than official urban shares (Somalia 2026: 65% cities). UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_share_by_urbanization: {definition: "Share of population by degree of urbanization", caveat: "International degree-of-urbanization definition; much higher than official urban shares. UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_age_6_13: {definition: "Population aged 6-13 (primary school age in Somalia's SHDS definition)", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_age_14_18: {definition: "Population aged 14-18", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/girls_10_19: {definition: "Girls aged 10-19", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/women_15_49_wpp: {definition: "Women aged 15-49", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_under1_wpp: {definition: "Population aged 0", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/population_under5_wpp: {definition: "Population aged 0-4", caveat: "UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/surviving_infants_est: {definition: "Surviving infants = WPP births x (1 - infant mortality / 1000), the cohort immunization targets use", caveat: "Estimate, national. UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
unpd_wpp/children_6_59m_est: {definition: "Children 6-59 months = half of age 0 plus ages 1-4", caveat: "Estimate (assumes births spread evenly), national. UN WPP 2024, national. Not WorldPop: never mix with WorldPop area figures. 2024 onward are projections."}
