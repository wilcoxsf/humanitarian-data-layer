[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hdl"
version = "2.0.0a1"
description = "Humanitarian Data Layer: public humanitarian, population and health data standardized onto one set of admin areas, with provenance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "exactextract>=0.2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hdl = "hdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
